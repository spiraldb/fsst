[package]
name = "fsst-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.fsst-rs]
path = ".."

[[bin]]
name = "fuzz_train"
path = "fuzz_targets/fuzz_train.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_compress"
path = "fuzz_targets/fuzz_compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fsst12_train"
path = "fuzz_targets/fuzz_fsst12_train.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fsst12_compress"
path = "fuzz_targets/fuzz_fsst12_compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_train_then_compress"
path = "fuzz_targets/fuzz_train_then_compress.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fsst12_train_then_compress"
path = "fuzz_targets/fuzz_fsst12_train_then_compress.rs"
test = false
doc = false
bench = false
