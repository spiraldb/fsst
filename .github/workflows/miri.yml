name: Miri

on:
  push:
    branches: ["develop"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  miri:
    name: "miri"
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-backtrace=full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install nightly toolchain with miri
        run: |
          rustup toolchain install nightly --component miri
          rustup override set nightly
      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref_name == 'develop' }}
          shared-key: "miri-cache-${{ runner.os }}"
      - name: Run miri
        run: |
          cargo miri setup
          cargo miri test

